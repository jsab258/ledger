<title>Wednesday's Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  --ground:#e9ecea; --surface:#f6f7f6; --ink:#1b2224; --muted:#56636a; --rule:#c9d0d0;
  --accent:#9a3e2b; --ok:#2e6a48; --chip:#dde2e1;
  --display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --type:"Courier Prime","Courier New",Courier,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121617; --surface:#1a2022; --ink:#e3e8e7; --muted:#98a4a7; --rule:#2d3639;
    --accent:#d27352; --ok:#63b384; --chip:#242c2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121617; --surface:#1a2022; --ink:#e3e8e7; --muted:#98a4a7; --rule:#2d3639;
  --accent:#d27352; --ok:#63b384; --chip:#242c2e; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:40px}
header{display:grid;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:18px}
.kicker{font:700 12px/1 var(--type);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(30px,5vw,46px)/1.02 var(--display);margin:0;text-wrap:balance}
h2{font:700 clamp(26px,4vw,34px)/1 var(--display);margin:0;text-wrap:balance}
h3{font:600 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0}
.how{margin:0;max-width:70ch;color:var(--muted)}
.tally,.was,.cap{font:400 13px/1.4 var(--type);color:var(--muted)}
.tally b{color:var(--ink)}
section.person{display:grid;gap:22px;background:var(--surface);border:1px solid var(--rule);padding:22px}
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.capgrid img{width:100%;display:block;background:var(--chip)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cand{display:grid;gap:8px;border:1px solid var(--rule);padding:10px;background:var(--ground)}
.cand.picked{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--chip)}
.speak{width:100%;aspect-ratio:4/3;background-color:var(--chip);background-repeat:no-repeat}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:600 14px/1 var(--display);letter-spacing:.04em;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:9px 12px;cursor:pointer;min-height:38px}
button:hover{border-color:var(--ink)}
button.playing{background:var(--ink);color:var(--ground);border-color:var(--ink)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.pick{display:flex;align-items:center;gap:6px;font:400 14px var(--type)}
.take{font:700 20px/1 var(--display)}
.acting{display:grid;gap:14px}
.feel{display:grid;gap:8px;border-top:1px solid var(--rule);padding-top:12px}
.feel .label{font:700 12px/1 var(--type);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.feel q{font-style:italic}
textarea{width:100%;min-height:54px;font:15px/1.4 var(--body);color:var(--ink);background:var(--ground);border:1px solid var(--rule);padding:8px}
.saved{font:400 13px var(--type);color:var(--muted)}
footer{font:400 13px/1.5 var(--type);color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <header>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div id="how"></div>
    <div class="tally" id="tally">Loading your earlier picks…</div>
  </header>
  <main class="wrap" id="people"></main>
  <footer id="foot"></footer>
</div>
<script>
const PAGE = {"tab": "Wednesday's Page", "kicker": "LEDGER · Wednesday 30 September", "title": "Wednesday's page", "how": ["Everything here passed my check and a blind reviewer's for obvious faults; the reviewer's remaining notes are beside each. Pick one per item; a note is optional. Your picks save on the page.", "Updated Wednesday, small hours. Your picks of Tuesday morning are acted on and off the page: Sheila's face is S4, in the game; Ron's threat keeps the game's own voice; Ron's and Darren's voices, their thinking sounds, the conversation light and how Sheila looks at you are approved; Darren's face waits on a man's haircut.", "Left for you: the street by day and at night, as whole frames; Darren with a man's haircut; Ron, faster, heard blind; a new voice for Sheila; their mouths moving as they speak; Ron's boots and Sheila's handbag; and two calls, each with my recommendation."], "foot": "Anything you do not pick carries onto the next page.", "sections": [{"kind": "look", "key": "look-street-dressed", "name": "The street, with its 1990 clutter", "note": "The street as the game draws it now, by day. New in it: a KX100 telephone kiosk, a pillar box, galvanised dustbins, cast-iron bollards, council litter bins, a telegraph pole with its wires to the houses, and a grit bin at the top of the street. Each passed my check and a blind reviewer's, which under your rule is their approval; the pillar box and kiosk carry no marks until you choose them. Say if anything jars. The blind reviewer's remaining notes: the kiosk's glass shows no tint or reflection, so it reads a little like an empty frame; the telegraph wires two to the flats opposite seem to end at the chimneys from the far end of the street, and no feed cable reaches the pole; the dustbins and the pillar box's foot are mostly hidden by cars and people in these views. (Its two other notes, the wires' sag and the litter bin crowding the lamp post, are fixed in these frames.) The stylised figures in these frames are the placeholders of 23 September; townspeople made as MetaHumans replace them for the friends' build.", "pictures": [{"src": "look-street-dressed/street-hook-day.webp", "alt": "Looking up the street from Mickey's"}, {"src": "look-street-dressed/street-camA-day.webp", "alt": "Along the east pavement"}], "options": [["yes", "Nothing jars"], ["no", "Something jars"]]}, {"kind": "look", "key": "look-street-night", "name": "The street at night, under its sodium lamps", "note": "\"Later that week, evening\" used to play in broad daylight; it now plays at night. The lamps are low-pressure sodium, one orange colour, lighting pools under each lamp with the gaps between left dark, and the wet road carries their reflections (from the research on 1990 street light). It passed my check and a blind reviewer's. Say if it reads as night to you, and if the orange is right. The blind reviewer's remaining notes: the left terrace's brick is lit almost evenly up to the eaves, closer to floodlighting than to pools; across the road the upper brick is brighter than the pavement in front of Rita's; the wet road carries few streaks from the lamps; colours survive the sodium light (the green stripes, the green bin), where under real sodium they would go orange and black; the cream tiles under the right-hand shop are the brightest patch; that shop's window reads as a board; the lit upstairs windows read cool grey-green rather than warm. Fixed since the first try, in these frames: lamps that pool light on the pavement, the town's orange glow in the sky, lit windows on the hillside and upstairs, and shops lit inside. The stylised figures in these frames are the placeholders of 23 September; townspeople made as MetaHumans replace them for the friends' build.", "pictures": [{"src": "look-street-night/street-night-camA.webp", "alt": "Along the east pavement, at night"}, {"src": "look-street-night/street-night-camB.webp", "alt": "Across the road at the shops, at night"}], "options": [["yes", "That reads as night"], ["no", "Not like this"]]}, {"kind": "faces", "key": "face-darren-milner-s6", "name": "Darren Milner, with a man's haircut", "pron": "him", "note": "His S4 face, which you turned down for its long hair, now with Epic's short casual cut and his bleached ends. It passed my check and a fresh reviewer's. The reviewer's remaining notes: it is not a grown-out perm (no wave, ears bare, nothing at the collar); the tips are a little even and gold, leaning late-90s; the top is slightly clumped; and the face itself, as in S4, is broader and reads nearer 30 than the concept's narrow 25.", "audio": "face-darren-milner-s6/speak-darren-milner.wav", "candidates": [{"take": "S6", "front": "face-darren-milner-s6/S6-front.jpg", "profile": "face-darren-milner-s6/S6-profile.jpg", "speak": {"file": "face-darren-milner-s6/S6-speak.jpg", "frames": 82, "cols": 10, "rows": 9, "fps": 15}}]}, {"kind": "pair", "key": "speed-ron-kirby", "name": "Ron, faster: the same three lines, two ways", "note": "One of these is Ron's voice as the game speaks it now, which takes about 3.5 seconds to start in play; the other is a free engine that starts in about 2. Heard blind: which is which is kept off the page. If the faster one is still Ron, the game switches him to it. My accent check: the faster engine held his accent on 15 of 16 test lines. The reviewer, measuring what it cannot hear: both word-perfect, no glitches, the same man; A is closer to his reference voice and steadier, with a creak on \"Right\"; B is livelier and rises on \"Who told you that?\"; a 4-second stretch of A, across \"that way. Right, I'll bring the car\", reads American to the accent check though each line on its own reads English: listen for it.", "line": "I don't know anything about that, and I'd rather keep it that way. / Right. I'll bring the car round at half nine, then. / Who told you that? Was it Darren? It was, wasn't it.", "takes": [{"label": "A", "audio": "speed-ron-kirby/speed-ron-A.wav"}, {"label": "B", "audio": "speed-ron-kirby/speed-ron-B.wav"}], "options": [["A", "A is Ron"], ["B", "B is Ron"], ["both", "Both are Ron"], ["neither", "Neither"]]}, {"kind": "voice", "key": "voice-sheila-dunn-p267", "name": "Sheila's voice, at last one that stays English", "note": "Her voice D leans American on every engine; this one is cloned from a Yorkshire woman's recordings (VCTK, the free-licence source of Ron's and Darren's voices) through the fast free engine, so she would also answer in about 2 seconds. It held an English accent on all 19 test lines. The reviewer's notes: it is cloned from a woman of 23, so listen for age; the pitch is ordinary rather than low; the third line is a little brisk for 'unhurried'. Her sheet's three lines.", "line": "Thirty-one years I've kept Mickey's books, love. I know what every fare cost and who never paid it. / Sit down, you're making the place look untidy. Now, what is it you think you want to know? / I saw what I saw. Whether I tell anybody else is a different question, isn't it.", "audio": "voice-sheila-dunn-p267/sheila-voice-p267.wav", "options": [["yes", "This is her"], ["older", "Her, but older"], ["no", "Not her"]]}, {"kind": "look", "key": "call-hair", "name": "Hair: the curls made in Blender failed three times", "note": "Your ruling was curls made in Blender. Three attempts, the last after research into how a 1990 shampoo-and-set is made (on rollers: shape by region, a side parting, the ends rolled under), all fail at a glance: above, the third on Sheila's head shows a hard parting, a stiff raised flap, a woven-looking cap, spikes on top and tassels at the back. Under the two-tries rule it is set aside. Sheila does not need it: the face you picked, S4, wears a short, soft, side-swept cut close to her portrait. (A) Epic's own MetaHuman haircuts, free: Sheila keeps S4's, and Darren wears the short cut just above (recommended; done meanwhile). (B) Keep at curls made in Blender, for Darren's grown-out perm: days, and uncertain.", "pictures": [{"src": "call-hair/sheila-attempt-3.webp", "alt": "The third attempt on Sheila's head: front, three-quarter, side, back"}, {"src": "call-hair/S4-front.jpg", "alt": "Darren's S4, with the long hair you turned down"}], "options": [["A", "A: Epic's haircuts (recommended)"], ["B", "B: keep at Blender curls"]]}, {"kind": "look", "key": "call-font", "name": "The street's name plates: a font's licence", "note": "The nearest free face to the Kindersley capitals of 1990 street name plates is Marcellus SC, under the SIL Open Font Licence, which lets a game ship a font and is widely used; it is not on LEDGER's licence allowlist, so the plates stay blank until you say. (A) Add the Open Font Licence to the allowlist, for fonts (recommended). (B) No: the plates stay blank.", "pictures": [], "options": [["A", "A: add it (recommended)"], ["B", "B: no"]]}, {"kind": "look", "key": "look-mouths-speaking", "name": "Their mouths, moving as they speak", "note": "Until tonight the three spoke with their mouths shut. Now, while one of them speaks, the loudness of the voice you hear opens the jaw and shapes the lips through the face's own controls, and the face rests again after. Each strip reads left to right, a tenth of a second a frame, filmed from 60 cm while they answered (the harsh light is the conversation light, aimed for the normal camera further back): Darren, Sheila, Ron. It passed my check and a fresh reviewer's (the first reviewer failed Darren's and Ron's, frozen by their thinking sounds; fixed). The reviewer's remaining notes: every open mouth is the same oval, the drift of the lips barely shows; the teeth have ragged, yellowish edges; Ron's upper lip lifts on one side and shows a greenish corner; Darren has a white strand under his lower lip. This is the quick way; Epic's own speech-to-face solver, found inside the engine, is the better one to try next.", "pictures": [{"src": "look-mouths-speaking/mouth-darren.webp", "alt": "Darren answering"}, {"src": "look-mouths-speaking/mouth-sheila.webp", "alt": "Sheila answering"}, {"src": "look-mouths-speaking/mouth-ron.webp", "alt": "Ron answering"}], "options": [["yes", "Roughly in time; keep it"], ["no", "Worse than still"]]}, {"kind": "look", "key": "look-dressed-boots-handbag", "name": "Dressed: Ron's work boots and Sheila's handbag", "note": "The clothing session's first pieces through its gate, fitted in the game: Ron's black work boots (in place of Epic's, which are hidden, and lifting him 2 cm onto their soles) and Sheila's chestnut handbag in her right hand. Clothes on people are yours to approve. Its reviewers' notes: the boots' collar a little ragged, the sole even with no heel step, the laces flat, the toe low and a touch long; the bag a little boxy, no metal loops at the handles, its clasp flat. Her spectacles are held back: made on her earlier face, on S4 they sit 2 to 3 cm high, so they have gone back to be refitted.", "pictures": [{"src": "look-dressed-boots-handbag/dressed-ron-boots.webp", "alt": "Ron in the alley, in his boots"}, {"src": "look-dressed-boots-handbag/dressed-ron-boots-close.webp", "alt": "The boots, close"}, {"src": "look-dressed-boots-handbag/dressed-sheila-handbag.webp", "alt": "Sheila with her handbag"}], "options": [["yes", "Yes, they stay"], ["no", "No"]]}]};
const state = {};
let db = null, canWrite = true, audio = null, playing = null, raf = 0;
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) { if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v); }
  for (const k of kids) if (k) n.append(k);
  return n;
}
function stop(){ if (audio) audio.pause(); if (playing) playing.classList.remove("playing"); clearInterval(raf); audio = null; playing = null; }
function play(src, btn, onFrame){
  const same = playing === btn; stop(); if (same) return;
  const a = new Audio(src); audio = a; playing = btn; btn.classList.add("playing");
  a.addEventListener("ended", () => { if (onFrame) onFrame(0); stop(); });
  a.play().then(() => { if (onFrame) raf = setInterval(() => { if (audio === a) onFrame(a.currentTime); }, 33); }).catch(() => stop());
}
function spriteBox(sp){
  const box = el("div", {class:"speak", role:"img", "aria-label":"speaking"});
  box.style.backgroundImage = "url(" + sp.file + ")";
  box.style.backgroundSize = (sp.cols * 100) + "% " + (sp.rows * 100) + "%";
  const show = i => {
    i = Math.max(0, Math.min(sp.frames - 1, i));
    const c = i % sp.cols, r = Math.floor(i / sp.cols);
    box.style.backgroundPosition = (sp.cols > 1 ? c / (sp.cols - 1) * 100 : 0) + "% " + (sp.rows > 1 ? r / (sp.rows - 1) * 100 : 0) + "%";
  };
  show(0);
  return {box, at: t => show(Math.floor(t * sp.fps))};
}
function save(key, patch){
  state[key] = Object.assign({}, state[key] || {}, patch, {at: new Date().toISOString()});
  render();
  if (!db || !canWrite) return;
  db.doc("verdicts/" + key).set(Object.assign({}, state[key])).catch(e => { if (e && e.code === "invalid_argument") { canWrite = false; render(); } });
}
function picks(key, options, cur){
  const row = el("div", {class:"row"});
  for (const [v, t] of options) {
    const id = "pick-" + key + "-" + v;
    const r = el("input", {type:"radio", name:"pick-" + key, id, value:v});
    if (cur === v) r.checked = true;
    r.addEventListener("change", () => save(key, {pick:v}));
    row.append(el("label", {class:"pick", for:id}, r, document.createTextNode(t)));
  }
  return row;
}
function note(key, st){
  const t = el("textarea", {placeholder:"What is right or wrong, in a few words (optional)"});
  t.value = st.note || "";
  t.addEventListener("change", () => save(key, {note:t.value}));
  return t;
}
function render(){
  const root = document.getElementById("people");
  root.replaceChildren();
  let judged = 0, total = 0;
  for (const s of PAGE.sections) {
    const st = state[s.key] || {};
    total++; if (st.pick) judged++;
    const sec = el("section", {class:"person", id:s.key});
    sec.append(el("div", {}, el("h2", {text:s.name})));
    if (s.note) sec.append(el("p", {class:"was", text:s.note}));
    if (s.kind === "faces") {
      const grid = el("div", {class:"cands"});
      for (const c of s.candidates.concat([{take:"none"}])) {
        const box = el("div", {class:"cand" + (st.pick === c.take ? " picked" : "")});
        if (c.take !== "none") {
          box.append(el("div", {class:"take", text:c.take}));
          box.append(el("div", {class:"pair"},
            c.front ? el("img", {src:c.front, alt:s.name + " " + c.take + ", front", loading:"lazy"}) : el("div", {class:"speak"}),
            c.profile ? el("img", {src:c.profile, alt:s.name + " " + c.take + ", profile", loading:"lazy"}) : el("div", {class:"speak"})));
          if (c.speak && s.audio) {
            const sp = spriteBox(c.speak);
            const b = el("button", {type:"button", text:"Play the line"});
            b.addEventListener("click", () => play(s.audio, b, sp.at));
            box.append(sp.box, el("div", {class:"row"}, b));
          }
        } else {
          box.append(el("div", {class:"take", text:"None of these"}));
        }
        const id = "pick-" + s.key + "-" + c.take;
        const radio = el("input", {type:"radio", name:"pick-" + s.key, id, value:c.take});
        if (st.pick === c.take) radio.checked = true;
        radio.addEventListener("change", () => save(s.key, {pick:c.take}));
        box.append(el("label", {class:"pick", for:id}, radio, document.createTextNode(c.take === "none" ? "None is " + s.pron : "This is " + s.pron)));
        grid.append(box);
      }
      sec.append(grid);
    } else if (s.kind === "look") {
      const g = el("div", {class:"capgrid"});
      for (const p of s.pictures) g.append(el("figure", {}, el("img", {src:p.src, alt:p.alt, loading:"lazy"}), el("figcaption", {class:"was", text:p.alt})));
      sec.append(g, picks(s.key, s.options, st.pick));
    } else if (s.kind === "pair") {
      const row = el("div", {class:"row"});
      for (const t of s.takes) {
        const b = el("button", {type:"button", text:"Play " + t.label});
        b.addEventListener("click", () => play(t.audio, b));
        row.append(b);
      }
      sec.append(row, el("div", {class:"row"}, el("q", {text:s.line})), picks(s.key, s.options, st.pick));
    } else if (s.kind === "voice") {
      const b = el("button", {type:"button", text:"Play"});
      b.addEventListener("click", () => play(s.audio, b));
      sec.append(el("div", {class:"row"}, b, el("q", {text:s.line})), picks(s.key, s.options, st.pick));
    }
    sec.append(note(s.key, st), el("span", {class:"saved", text: st.at ? "Saved " + new Date(st.at).toLocaleString() : ""}));
    root.append(sec);
  }
  document.getElementById("tally").innerHTML = "<b>" + judged + " of " + total + "</b> picked" + (db ? "" : " · picks are not being stored on this view");
}
document.getElementById("kicker").textContent = PAGE.kicker;
document.getElementById("title").textContent = PAGE.title;
for (const h of PAGE.how) document.getElementById("how").append(el("p", {class:"how", text:h}));
document.getElementById("foot").textContent = PAGE.foot || "";
render();
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { render(); return; }
  for (const s of PAGE.sections) {
    try { const d = await db.doc("verdicts/" + s.key).get(); if (d.exists) state[s.key] = Object.assign({}, d.data()); } catch (e) {}
  }
  render();
})();
</script>
