<title>Wednesday's Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  --ground:#e9ecea; --surface:#f6f7f6; --ink:#1b2224; --muted:#56636a; --rule:#c9d0d0;
  --accent:#9a3e2b; --ok:#2e6a48; --chip:#dde2e1;
  --display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --type:"Courier Prime","Courier New",Courier,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121617; --surface:#1a2022; --ink:#e3e8e7; --muted:#98a4a7; --rule:#2d3639;
    --accent:#d27352; --ok:#63b384; --chip:#242c2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121617; --surface:#1a2022; --ink:#e3e8e7; --muted:#98a4a7; --rule:#2d3639;
  --accent:#d27352; --ok:#63b384; --chip:#242c2e; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:40px}
header{display:grid;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:18px}
.kicker{font:700 12px/1 var(--type);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(30px,5vw,46px)/1.02 var(--display);margin:0;text-wrap:balance}
h2{font:700 clamp(26px,4vw,34px)/1 var(--display);margin:0;text-wrap:balance}
h3{font:600 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0}
.how{margin:0;max-width:70ch;color:var(--muted)}
.tally,.was,.cap{font:400 13px/1.4 var(--type);color:var(--muted)}
.tally b{color:var(--ink)}
section.person{display:grid;gap:22px;background:var(--surface);border:1px solid var(--rule);padding:22px}
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.capgrid img{width:100%;display:block;background:var(--chip)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cand{display:grid;gap:8px;border:1px solid var(--rule);padding:10px;background:var(--ground)}
.cand.picked{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--chip)}
.speak{width:100%;aspect-ratio:4/3;background-color:var(--chip);background-repeat:no-repeat}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:600 14px/1 var(--display);letter-spacing:.04em;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:9px 12px;cursor:pointer;min-height:38px}
button:hover{border-color:var(--ink)}
button.playing{background:var(--ink);color:var(--ground);border-color:var(--ink)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.pick{display:flex;align-items:center;gap:6px;font:400 14px var(--type)}
.take{font:700 20px/1 var(--display)}
.acting{display:grid;gap:14px}
.feel{display:grid;gap:8px;border-top:1px solid var(--rule);padding-top:12px}
.feel .label{font:700 12px/1 var(--type);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.feel q{font-style:italic}
textarea{width:100%;min-height:54px;font:15px/1.4 var(--body);color:var(--ink);background:var(--ground);border:1px solid var(--rule);padding:8px}
.saved{font:400 13px var(--type);color:var(--muted)}
footer{font:400 13px/1.5 var(--type);color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <header>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div id="how"></div>
    <div class="tally" id="tally">Loading your earlier picks…</div>
  </header>
  <main class="wrap" id="people"></main>
  <footer id="foot"></footer>
</div>
<script>
const PAGE = {"tab": "Wednesday's Page", "kicker": "LEDGER · Wednesday 30 September", "title": "Wednesday's page", "how": ["Everything here passed my check and a blind reviewer's for obvious faults; the reviewer's remaining notes are beside each. Pick one per item; a note is optional. Your picks save on the page.", "Updated Tuesday evening. Your picks of Tuesday morning are acted on and off the page: Sheila's face is S4, with its hair, and goes into the game tonight; Ron's threat keeps the game's own voice (your blind B); Ron's and Darren's voices, their thinking sounds, the conversation light and how Sheila looks at you are approved; Darren's face waits on a man's haircut.", "Left for you: the street by day and at night, as whole frames, and three calls, each with my recommendation."], "foot": "Anything you do not pick carries onto the next page.", "sections": [{"kind": "look", "key": "look-street-dressed", "name": "The street, with its 1990 clutter", "note": "The street as the game draws it now, by day. New in it: a KX100 telephone kiosk, a pillar box, galvanised dustbins, cast-iron bollards, council litter bins, a telegraph pole with its wires to the houses, and a grit bin at the top of the street. Each passed my check and a blind reviewer's, which under your rule is their approval; the pillar box and kiosk carry no marks until you choose them. Say if anything jars. The blind reviewer's remaining notes: the kiosk's glass shows no tint or reflection, so it reads a little like an empty frame; the telegraph wires two to the flats opposite seem to end at the chimneys from the far end of the street, and no feed cable reaches the pole; the dustbins and the pillar box's foot are mostly hidden by cars and people in these views. (Its two other notes, the wires' sag and the litter bin crowding the lamp post, are fixed in these frames.)", "pictures": [{"src": "look-street-dressed/street-hook-day.webp", "alt": "Looking up the street from Mickey's"}, {"src": "look-street-dressed/street-camA-day.webp", "alt": "Along the east pavement"}], "options": [["yes", "Nothing jars"], ["no", "Something jars"]]}, {"kind": "look", "key": "look-street-night", "name": "The street at night, under its sodium lamps", "note": "\"Later that week, evening\" used to play in broad daylight; it now plays at night. The lamps are low-pressure sodium, one orange colour, lighting pools under each lamp with the gaps between left dark, and the wet road carries their reflections (from the research on 1990 street light). It passed my check and a blind reviewer's. Say if it reads as night to you, and if the orange is right. The blind reviewer's remaining notes: the left terrace's brick is lit almost evenly up to the eaves, closer to floodlighting than to pools; across the road the upper brick is brighter than the pavement in front of Rita's; the wet road carries few streaks from the lamps; colours survive the sodium light (the green stripes, the green bin), where under real sodium they would go orange and black; the cream tiles under the right-hand shop are the brightest patch; that shop's window reads as a board; the lit upstairs windows read cool grey-green rather than warm. Fixed since the first try, in these frames: lamps that pool light on the pavement, the town's orange glow in the sky, lit windows on the hillside and upstairs, and shops lit inside.", "pictures": [{"src": "look-street-night/street-night-camA.webp", "alt": "Along the east pavement, at night"}, {"src": "look-street-night/street-night-camB.webp", "alt": "Across the road at the shops, at night"}], "options": [["yes", "That reads as night"], ["no", "Not like this"]]}, {"kind": "look", "key": "call-hair", "name": "Hair: the curls made in Blender failed three times", "note": "Your ruling was curls made in Blender. Three attempts, the last after research into how a 1990 shampoo-and-set is made (on rollers: shape by region, a side parting, the ends rolled under), all fail at a glance: above, the third on Sheila's head shows a hard parting, a stiff raised flap, a woven-looking cap, spikes on top and tassels at the back. Under the two-tries rule it is set aside. Sheila does not need it: the face you picked, S4, wears a short, soft, side-swept cut close to her portrait. Darren does: his S4 wears long hair, your 'woman's haircut'. (A) Epic's own MetaHuman haircuts, free: the nearest man's short cut to his sheet (a grown-out perm, bleached tips) on your next page with his face, and Sheila keeps S4's (recommended; I am doing it meanwhile). (B) Keep at curls made in Blender: days, and uncertain.", "pictures": [{"src": "call-hair/sheila-attempt-3.webp", "alt": "The third attempt on Sheila's head: front, three-quarter, side, back"}, {"src": "call-hair/S4-front.jpg", "alt": "Darren's S4, with the long hair you turned down"}], "options": [["A", "A: Epic's haircuts (recommended)"], ["B", "B: keep at Blender curls"]]}, {"kind": "look", "key": "call-marks", "name": "The pillar box and the kiosk: whose marks", "note": "Both stand in the street plain, with no postal cipher and no telephone company's mark. Canon says every brand is fictional. (A) Marks made up for LEDGER's Britain, in the 1990 manner (recommended). (B) The real 1990 marks: against canon. (C) Plain, as now.", "pictures": [{"src": "call-marks/pillar-box.jpg", "alt": "The pillar box, plain"}, {"src": "call-marks/kx100-kiosk.jpg", "alt": "The kiosk, plain"}], "options": [["A", "A: made-up marks (recommended)"], ["B", "B: the real ones"], ["C", "C: plain"]]}, {"kind": "look", "key": "call-font", "name": "The street's name plates: a font's licence", "note": "The nearest free face to the Kindersley capitals of 1990 street name plates is Marcellus SC, under the SIL Open Font Licence, which lets a game ship a font and is widely used; it is not on LEDGER's licence allowlist, so the plates stay blank until you say. (A) Add the Open Font Licence to the allowlist, for fonts (recommended). (B) No: the plates stay blank.", "pictures": [], "options": [["A", "A: add it (recommended)"], ["B", "B: no"]]}]};
const state = {};
let db = null, canWrite = true, audio = null, playing = null, raf = 0;
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) { if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v); }
  for (const k of kids) if (k) n.append(k);
  return n;
}
function stop(){ if (audio) audio.pause(); if (playing) playing.classList.remove("playing"); clearInterval(raf); audio = null; playing = null; }
function play(src, btn, onFrame){
  const same = playing === btn; stop(); if (same) return;
  const a = new Audio(src); audio = a; playing = btn; btn.classList.add("playing");
  a.addEventListener("ended", () => { if (onFrame) onFrame(0); stop(); });
  a.play().then(() => { if (onFrame) raf = setInterval(() => { if (audio === a) onFrame(a.currentTime); }, 33); }).catch(() => stop());
}
function spriteBox(sp){
  const box = el("div", {class:"speak", role:"img", "aria-label":"speaking"});
  box.style.backgroundImage = "url(" + sp.file + ")";
  box.style.backgroundSize = (sp.cols * 100) + "% " + (sp.rows * 100) + "%";
  const show = i => {
    i = Math.max(0, Math.min(sp.frames - 1, i));
    const c = i % sp.cols, r = Math.floor(i / sp.cols);
    box.style.backgroundPosition = (sp.cols > 1 ? c / (sp.cols - 1) * 100 : 0) + "% " + (sp.rows > 1 ? r / (sp.rows - 1) * 100 : 0) + "%";
  };
  show(0);
  return {box, at: t => show(Math.floor(t * sp.fps))};
}
function save(key, patch){
  state[key] = Object.assign({}, state[key] || {}, patch, {at: new Date().toISOString()});
  render();
  if (!db || !canWrite) return;
  db.doc("verdicts/" + key).set(Object.assign({}, state[key])).catch(e => { if (e && e.code === "invalid_argument") { canWrite = false; render(); } });
}
function picks(key, options, cur){
  const row = el("div", {class:"row"});
  for (const [v, t] of options) {
    const id = "pick-" + key + "-" + v;
    const r = el("input", {type:"radio", name:"pick-" + key, id, value:v});
    if (cur === v) r.checked = true;
    r.addEventListener("change", () => save(key, {pick:v}));
    row.append(el("label", {class:"pick", for:id}, r, document.createTextNode(t)));
  }
  return row;
}
function note(key, st){
  const t = el("textarea", {placeholder:"What is right or wrong, in a few words (optional)"});
  t.value = st.note || "";
  t.addEventListener("change", () => save(key, {note:t.value}));
  return t;
}
function render(){
  const root = document.getElementById("people");
  root.replaceChildren();
  let judged = 0, total = 0;
  for (const s of PAGE.sections) {
    const st = state[s.key] || {};
    total++; if (st.pick) judged++;
    const sec = el("section", {class:"person", id:s.key});
    sec.append(el("div", {}, el("h2", {text:s.name})));
    if (s.note) sec.append(el("p", {class:"was", text:s.note}));
    if (s.kind === "faces") {
      const grid = el("div", {class:"cands"});
      for (const c of s.candidates.concat([{take:"none"}])) {
        const box = el("div", {class:"cand" + (st.pick === c.take ? " picked" : "")});
        if (c.take !== "none") {
          box.append(el("div", {class:"take", text:c.take}));
          box.append(el("div", {class:"pair"},
            c.front ? el("img", {src:c.front, alt:s.name + " " + c.take + ", front", loading:"lazy"}) : el("div", {class:"speak"}),
            c.profile ? el("img", {src:c.profile, alt:s.name + " " + c.take + ", profile", loading:"lazy"}) : el("div", {class:"speak"})));
          if (c.speak && s.audio) {
            const sp = spriteBox(c.speak);
            const b = el("button", {type:"button", text:"Play the line"});
            b.addEventListener("click", () => play(s.audio, b, sp.at));
            box.append(sp.box, el("div", {class:"row"}, b));
          }
        } else {
          box.append(el("div", {class:"take", text:"None of these"}));
        }
        const id = "pick-" + s.key + "-" + c.take;
        const radio = el("input", {type:"radio", name:"pick-" + s.key, id, value:c.take});
        if (st.pick === c.take) radio.checked = true;
        radio.addEventListener("change", () => save(s.key, {pick:c.take}));
        box.append(el("label", {class:"pick", for:id}, radio, document.createTextNode(c.take === "none" ? "None is " + s.pron : "This is " + s.pron)));
        grid.append(box);
      }
      sec.append(grid);
    } else if (s.kind === "look") {
      const g = el("div", {class:"capgrid"});
      for (const p of s.pictures) g.append(el("figure", {}, el("img", {src:p.src, alt:p.alt, loading:"lazy"}), el("figcaption", {class:"was", text:p.alt})));
      sec.append(g, picks(s.key, s.options, st.pick));
    } else if (s.kind === "pair") {
      const row = el("div", {class:"row"});
      for (const t of s.takes) {
        const b = el("button", {type:"button", text:"Play " + t.label});
        b.addEventListener("click", () => play(t.audio, b));
        row.append(b);
      }
      sec.append(row, el("div", {class:"row"}, el("q", {text:s.line})), picks(s.key, s.options, st.pick));
    } else if (s.kind === "voice") {
      const b = el("button", {type:"button", text:"Play"});
      b.addEventListener("click", () => play(s.audio, b));
      sec.append(el("div", {class:"row"}, b, el("q", {text:s.line})), picks(s.key, s.options, st.pick));
    }
    sec.append(note(s.key, st), el("span", {class:"saved", text: st.at ? "Saved " + new Date(st.at).toLocaleString() : ""}));
    root.append(sec);
  }
  document.getElementById("tally").innerHTML = "<b>" + judged + " of " + total + "</b> picked" + (db ? "" : " · picks are not being stored on this view");
}
document.getElementById("kicker").textContent = PAGE.kicker;
document.getElementById("title").textContent = PAGE.title;
for (const h of PAGE.how) document.getElementById("how").append(el("p", {class:"how", text:h}));
document.getElementById("foot").textContent = PAGE.foot || "";
render();
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { render(); return; }
  for (const s of PAGE.sections) {
    try { const d = await db.doc("verdicts/" + s.key).get(); if (d.exists) state[s.key] = Object.assign({}, d.data()); } catch (e) {}
  }
  render();
})();
</script>
