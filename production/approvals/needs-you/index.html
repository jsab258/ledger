<script>
const PAGE = {"tab": "LEDGER: Needs you", "kicker": "LEDGER · Needs you · 2 open · updated Sunday 8 November, 13:16", "title": "Needs you", "how": ["Only what is open for you, oldest first. Each item says what to do, links everything it needs, and gives my recommendation. It leaves this page once you have answered it here or done it.", "Pick an answer under each item; a note is optional."], "foot": "One page, one link, kept current (his order of 2 November). The same list is kept as plain data beside it (items.json) for the advisor's checker.", "sections": [{"kind": "need", "key": "side-stories-2026-11-08", "name": "Thirty-two side stories for the Hook, drafted within canon from your waiting list (light ones mostly, a few dark). Do they stand as the list the jobs are built from when phase 3 comes? Read them under 'Read it here'; a note is optional.", "links": [], "recommendation": "Yes: they keep canon and your rulings, and each ends in something the town remembers, which is what the game is about. Your note can strike or change any of them, or rule the three points named at the top. No web link: the stories are on this page.", "added": "2026-11-08 10:32", "pictures": [], "detail": ["How they work: each is found on foot (overheard, asked in passing, seen through a window), never a marker; offered when something has happened, not at a set hour; the person waits a while, then stops waiting, and that is an ending too. Every ending changes what somebody in the street knows or says about Tom. Canon's rule throughout: adults only, no drink, no gambling, nothing sexual, no slur ever said, Tom never drives. None touches the fire, Mickey's real book, the sit-down, the inspection or the endings. Three points are yours inside them: the words on Mickey's sign (6); whether a story may lean on a main character's private life (4 Ron's Fridays, 18 Mickey's letters to June, 29 Ada's rent); and Mickey's mooring (17), a thing of his the draft invents. Checked against canon by one fresh reviewer, its twelve fixes made.", "1. The long way round (grey; Act I; micro). Found: Sheila's fare book, once she lets him see the day book, or Pauline on the radio saying \"Kevin's quiet again.\" Kevin Needham's day fares come in short against his mileage; he is running his own jobs in Mickey's car. Steps: the day book at the counter; Kevin's car on the rank, its mileage; Pauline's log; Kevin at the caff at his break. Ends: sack him (the rank is one car short; the drivers learn the new owner reads the book); let him keep it for a cut (a racket starts, and the fare book lies a little more); say nothing and pay the gap (Sheila sees it). If it goes wrong: Kevin hears he is being looked at and quits on the rank in front of the street. The town keeps: whether Tom reads the book.", "2. Two real minutes (light; Act I; micro). Found: Pauline Kitching, mid-call, asks whoever is at the counter to take the phone for a minute. A caller wants a car \"for the doctor's at ten\" and will only give her name to Pauline. Tom can take the call, take the order wrong, or hand back. Ends: the booking is right and Pauline says \"You'll do\" to Terry that night; it goes wrong and the caller walks, telling the newsagent's queue Mickey's has gone to pot. The town keeps: Pauline's first word on him, which she repeats on the radio to both drivers.", "3. The night lodger (light; Act I; micro). Found: Ian Megginson, passing the office door, says the front lock is \"anybody with a hairpin and an hour\", and the scratches on it are new. Norman Dent saw a light in the yard at three. Steps: the scratched lock; Norman on the warehouse row at night; the yard after midnight, where Darren Milner is asleep across the back seat of the spare car. Ends: throw him out (Darren tells the parade Tom is hard); let him stay as a night eye on the yard (Darren becomes Tom's, and talks about it); pay Ian for a new lock and say nothing. The town keeps: how the new owner treats a man with nowhere to go.", "4. Mickey's Friday (light; Act I; micro). Found: Lily Tang, handing over Tom's first order: \"Same as Mickey's? Every Friday, two of number nine. I remember.\" Steps: ask who ate the second; Ron, asked at the rank, goes quiet, then says \"Fridays, aye.\" Ends: keep Fridays with Ron (Ron's loyalty takes a step; he tells Sheila); let it lapse; ask Lily to stop reminding him. The town keeps: Lily tells Peter, and Peter tells nobody, which is the point.", "5. A coat from the back room (grey; Act I to II; micro). Found: Tracey Scarth, at her market stall or in the laundry's back room, sees Tom in his one jacket: \"Mickey had a good coat. Bring it me, I'll take it in two inches.\" The coat hangs in the office. Steps: the coat on the office hook; Tracey's pins; June, if she sees it on him. Ends: wear Mickey's coat (Tom rises in clothes; the street reads him as Mickey's heir, and June goes cold); give it to June (she keeps it, or gives it back on her own terms); leave it on the hook. The town keeps: whose coat is walking down Quay Street.", "6. The name on the board (light, with weight; Act I to II; micro). Found: Shaun Hewson, repainting the parade's boards this month, stops under Mickey's sign with his ladder: \"Wants doing. What's it to say?\" Ends: the old name fresh painted (the street reads continuity); the old name with \"prop. T. Nowak\" small underneath (the street reads a takeover, politely); leave it peeling (Shaun tells the caff the new man doesn't care). The town keeps: the sign itself, which everybody passes. For him: the sign's words are his to rule; the draft keeps Mickey's name in every ending.", "7. A ride for the sergeant (grey; Act II; micro). Found: a rainy night, the phone rings and Pauline says, dry: \"It's the police. She wants a car.\" DS Carol Ellis's own car has failed by the fish market. Steps: Terry takes the job; Tom can ride along, send Terry alone, or refuse the fare. Ends: the ride with her (a live talk in the back of a cab; she learns what he says and how he says it); Terry alone (Terry tells Tom what she asked him, or says \"nothing\" and means it); refused (Ellis walks home in the rain and remembers). The town keeps: Terry's version, told to Kevin.", "8. Haddock's dear (light; Act I; micro). Found: Brenda Laverack, loud at her counter: her dawn order on the fish dock is coming up short and somebody is collecting it under her name. Steps: the fish market railing at dawn; the porter who signs for her boxes; the syndicate's man who takes the porters' cut. Ends: catch the porter yourself (a word, or fists, seen on the dock); pay Brenda's loss and say nothing; ask the Widow's people to sort it (it is sorted at once, and the dock now knows whose favour Tom asked). If it goes wrong: the porter sees him coming and the dock closes ranks; Brenda tells everyone he tried. The town keeps: Brenda's version, which the whole parade hears by noon.", "9. Twelve weeks' notice (grey; Act I to II; micro). Found: Julie Kettlewell at the kiosk, fed up, telling anyone near that the steam laundry held back her last weeks' money. Steps: the laundry's office; its owner; Doreen Harland, who saw the pay packets made up. Ends: lean on the owner (he pays, and tells the harbour office clerk he was threatened); pay Julie from the office (Sheila marks it in the book); give her a job on the office phone beside Pauline. The town keeps: whether Mickey's still looks after its own, and who counts as its own now.", "10. The laundry's hampers (light; Act II; micro). Found: Doreen Harland, at the laundry's side door with a stack of hampers and no van: \"Your lot could carry these for us. Mickey would have.\" Ends: take the contract (clean money on the fare book, the drivers grumbling); turn it down; take it at a price too low to be clean, which Sheila will ask about. The town keeps: the cab office's name on the laundry's run, seen twice a day.", "11. The window at the caff (grey; Act I to II; micro). Found: Grace Rinaldi's front window boarded one morning; she will not say who, and says \"no police, and no fists either.\" Steps: Grace; Tracey, who saw a young man running; the newest of Danny Cammack's crew, a man of about twenty, on the corner. Ends: bring him to wash Grace's pots for a week, her justice (Grace forgets nobody); hand him to Ellis (Grace calls it police, which she said not to, and says so at the counter); hurt him (Grace bars Tom from the caff, and says why). The town keeps: that Tom did it Grace's way, or did not.", "12. Closing time at the Tangs' (grey; Act II; micro). Found: at closing, young men in their twenties shouting at the takeaway's window; no words are heard, only the noise and Lily's face. Peter says it is nothing, as he always does. Steps: be at the counter at closing on the next nights; or Ron there; or speak to the men at the corner. Ends: presence alone ends it (Lily remembers); Tom humiliates the leader in front of the parade (it ends, and Danny's crew notices); nothing (it goes on, and the regulars see him not see it). Content: racism here is a fact about the men, never voiced and never rewarded. The town keeps: who stood at the counter.", "13. Off the back of a lorry (light; Act I; micro). Found: Darren, on the pavement outside the office, with a crate of transistor radios (a made-up maker's name) and a grin: \"Ten each to you. I owe you anyway.\" Ends: buy one (it works, for a week); refuse; make him pay off what he owes Mickey's first, in radios. If it goes wrong: the radios are the chandler's, and the chandler sees one in the office. The town keeps: what Tom buys and from whom.", "14. Posters on the glass (light; Act I to II; micro). Found: every morning a fresh anti-poll-tax poster on Mickey's window (the town's own invented campaign, no real party or person). Its organiser, a woman from Fairview, asks if she may put one up properly. Ends: let her (half the street nods, the harbour office frowns); tear them down each morning (the campaign paints the kerb instead); let both sides post. The town keeps: which side of the window the office is on.", "15. Half the berths empty (dark; Act II; micro). Found: Colin Mastin, at the crane's foot at the end of a shift, asks Tom straight: the Widow's people have offered dockers night work off the books; should he take it? Steps: Colin; the night berth; one night's look from the fish market railing. Ends: tell him to take it (Tom has a man inside the syndicate's nights, and Colin's risk is on Tom); tell him not to (Colin is short, and resents it, or thanks him); give him driving work on the rank. If it goes wrong: Colin is caught on the berth one night, and the dock decides whose man he was. The town keeps: who Colin says he asked.", "16. The name board (light; Act I to II; micro). Found: Albert Suggitt, mending nets, mentions his old boat's name board went for scrap. It is at Dennis Iveson's yard on the warehouse row. (The boat's name is minted for the game; this one is a placeholder.) Ends: buy it back at Dennis's price (Dennis remembers who pays fair); take it (Dennis remembers that too); tell Albert it is gone. The town keeps: Albert's story of the board, told at the caff for weeks.", "17. Mickey's mooring (grey; Act II; micro). Found: Gary Mawer at the caff, over a bacon sandwich: Mickey rented a mooring at the yard, three months unpaid, and nobody's boat is on it. Steps: the yard; the bill; the Widow's man, who asks about the mooring the same week. Ends: pay and keep it empty (the Widow notices a man keeping a berth he does not use; boats stay scenery); let her people have it (money, and a debt of goodwill she will call in); let the yard take it back for the bill. The town keeps: whether the new owner is in the boat trade, which is the dock's real question.", "18. The ferry parcel (grey; Act I to II; micro). Found: Gordon Leckenby, at the landing: a parcel in Mickey's hand, addressed to June at an old address across the water, came back on the boat marked \"not known\", and was left at the landing for Mickey's. Inside, letters to her, years of them. Ends: give them to June unopened (her thread moves; she may speak to him at last); read them first (Tom learns something of Mickey, and June can tell); burn them. The town keeps: how June is with Tom afterwards, which the street reads at once; Gordon only talks about the weather.", "19. The quiet quay (grey; Act II to III; micro). Found: Susan Coverdale, the customs officer who lives past Rita's, asks for a car at night after a late turn, and talks in the back. She notices things for a living. Steps: her late fares, two or three nights, Tom along or not. Ends: straight rides and straight talk (one careful officer who thinks him honest, and says so to people she trusts); use her talk for the night business (she notices that too); refuse her fares. The town keeps: what one careful woman tells her colleagues.", "20. All on the forms (grey; Act II; micro). Found: Christine Pickering, harbour office clerk, at the newsagent's: a stranger has been asking at the harbour office who holds the lease on the yard behind Mickey's. She thought he ought to know. Ends: thank her (a source in the harbour office, who expects only manners); press money on her (she is insulted, and stops telling him things); ignore it (he never learns who asked). The town keeps: a clerk's opinion of his manners.", "21. Lilies (light; Act I; micro). Found: Winifred Duggleby, doing the chapel's flowers: \"Nobody gives lilies any more.\" It is her husband's anniversary on Sunday. Steps: the market in Copper Row, by a car from the rank. Ends: lilies on the altar (Winifred tells the whole chapel; Father Walsh hears who sent them); chrysanthemums again. The town keeps: a kindness, told after the service.", "22. Father Walsh's rounds (light; Act I to II; micro). Found: Nora Cronin, at the grocer's: the priest walks to his sick calls at night in all weathers and will not take a lift as charity. Could a car \"just happen\" to be passing? Ends: arrange it quietly (Father Walsh guesses within a week and says nothing, which is his thanks); tell him outright (he refuses, kindly); leave it. The town keeps: Nora's protectiveness turned his way, or not.", "23. Lead off the roof (grey; Act II; micro). Found: rain through the chapel roof onto Winifred's flowers; Dennis Iveson has bought a stack of lead \"fair's fair\" from two of Danny Cammack's men. Steps: the wet altar; Dennis's scales; the two at the corner. Ends: buy the lead back for the roof (Dennis profits twice and knows it); lean on the two (they return the money, and Danny hears Tom touched his crew); give Ellis their names (whoever saw him at her car says so; the parish does not thank a grass, and Danny's crew asks who it was). The town keeps: who mended the chapel, which the parish says from the pulpit as a thank-you, no name or a name.", "24. Sign there, dear (light; Act I to II; micro). Found: Edith Stockill at the pension counter has the newsagent as one witness to her will and asks Tom, a stranger, to be the second, because \"everybody else round here talks.\" She leaves her savings to the parish. Ends: witness it and keep it (it never reaches the street, which the simulation proves; Edith tells Sheila he can be trusted); witness it and let it slip (Edith hears it back within a week); decline. The town keeps: Edith's word to Sheila, or the street's knowing what it should not; either way, how he keeps a confidence.", "25. Looking costs nothing (grey; Act I; micro). Found: Rita Welburn, polite at the pawn's counter: Mickey's watch came in the week he died. She will not say who brought it until Tom redeems the ticket. Steps: the ticket; Rita; Hal, who knows already. It was Ron, for the funeral flowers. Ends: redeem it and give it back to Ron without a word (Ron's loyalty takes a big step); ask him why (he tells, and is ashamed); leave it in Rita's window, where the street can see Mickey's watch for sale. The town keeps: Hal hears on Monday whatever happened.", "26. Monday at Hal's (light; any act; micro, repeating). Found: Hal Metcalfe, in the coin shop that sells no coins: \"It's the company I keep the shop for.\" Come by on a Monday with the paper and he will talk. Ends: Monday visits (each week Hal tells Tom what the street is saying about him, a day before he would hear it, through the gossip the simulation already keeps); none. The town keeps: that Tom sits with Hal; and Hal remembers everyone's business, Tom's included.", "27. Friday means Friday (grey; Act I to II; micro). Found: Sylvia Rennison, on her step in her slippers: a lodger is three weeks behind and he is one of Danny Cammack's. Mickey would have had a word. Ends: send Ron (it is paid; Danny's crew hears Mickey's is still Mickey's); pay it yourself (Sylvia is grateful and tells nobody, then everybody); refuse, \"I'm not Mickey\" (Sylvia repeats it, word for word). The town keeps: the phrase Tom used.", "28. One way (light; Act I to II; micro). Found: Karen Grummitt at the ferry's ticket window, quietly: a car at five on Thursday, with her case, and not a word to Mrs Rennison, whom she owes a fortnight. Ends: the car at five (she gets away; Sylvia learns whose car and is cool with Tom for a month); tell Sylvia (Karen stays, and hates the Hook a little more, and him); pay her fortnight for her and send the car. The town keeps: Sylvia's version, or Karen's postcard to the ticket window.", "29. The rent on Ada's window (grey; Act I; micro). Found: Dawn Pybus, apologetic, with her clipboard on Ada's step: the landlord has raised Ada's rent, and Ada has said nothing. Sheila, asked, admits Mickey paid the difference without Ada knowing. The landlord's agent is a firm in the Exchange. Ends: keep paying it in secret (Ada never knows; Sheila does, and it counts); tell Ada (she refuses his money and her tea goes cold, or she takes it and is ashamed); let it stop (Ada moves her chair from the window to the back room, and the street notices its watcher gone). The town keeps: who keeps Ada at her window. Beside: the outline's \"Ada's tea is the week's first test\"; this story is offered only after that test, never before.", "30. The lamp outside Ada's (light; Act I to II; micro). Found: Ada, at her window: the lamp outside has been out for weeks, the council will not come. Steps: the kiosk and the council's number; the harbour office; the harbour office's works man, who can get a lamp seen to for a favour. Ends: fixed through him (a small favour owed); fixed by Ian with a ladder, against the rules (a lit pavement, and a council letter); left dark. The town keeps: the light itself, every night.", "31. Nothing moves but me (dark; Act II; micro). Found: Norman Dent, glad of company on his round, mentions lights in an empty warehouse: crates of car radios, Danny's crew's. He wants nothing but a flask of tea and someone to tell. Steps: the row at night; the warehouse; the crates. Ends: tip Ellis (the crew loses its stock, and Norman becomes a witness who saw Tom ask; who else saw is the simulation's); take the crates and sell them through the back of Rita's (money, and Danny's grudge); warn Danny (a favour owed). The cost Tom can see: Norman misses nothing on that row, Tom's own nights included. The town keeps: whatever Norman saw, which is everything.", "32. The camcorder (dark; any act; micro; offered only if Tom did something seen and filmed). Found: canon's one camcorder in town has Tom on a tape: whatever he did on the street that its owner filmed from a window (the simulation decides whether anything was). Its owner is minted when the camcorder is placed; the draft gives it to Hal. Ends: buy the tape (it is gone, and Hal knows its price); take it (Hal tells everyone a tape existed, which is worse); let it lie (it reaches Ellis or Alison, by the gossip's own routes). The town keeps: a picture, the one witness that does not forget."], "options": [["yes", "Yes, they stand (recommended)"], ["note", "Yes, with my note"], ["no", "N     if (swipe && sc <= fit * 1.02) {
      const dx = p.x - swipe.x, dy = p.y - swipe.y, dt = Date.now() - swipe.t;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) { show(idx + (dx < 0 ? 1 : -1)); swipe = drag = null; return; }
    }
    if (swipe && Math.hypot(p.x - swipe.x, p.y - swipe.y) < 10) {
      const now = Date.now();
      if (now - lastTap < 320) { lastTap = 0; if (sc > fit * 1.02) fitNow(); else zoomAt(Math.max(1, fit * 2.5), p.x, p.y); }
      else lastTap = now;
    }
    swipe = drag = null;
  }
  stage.addEventListener("pointerup", lift); stage.addEventListener("pointercancel", lift);
  window.addEventListener("resize", () => { if (view.classList.contains("on")) fitNow(); });
})();
</script>
