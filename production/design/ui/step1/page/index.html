<title>LEDGER Screens, Look</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* The house style of Jafar's daily pages (production/approvals/), so this one
   reads as one of them: one decision at the top, the pictures folded below. */
:root{
  --ground:#e9ecea; --surface:#f6f7f6; --ink:#1b2224; --muted:#56636a; --rule:#c9d0d0;
  --accent:#9a3e2b; --ok:#2e6a48; --chip:#dde2e1;
  --display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --type:"Courier Prime","Courier New",Courier,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121617; --surface:#1a2022; --ink:#e3e8e7; --muted:#98a4a7; --rule:#2d3639;
    --accent:#d27352; --ok:#63b384; --chip:#242c2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121617; --surface:#1a2022; --ink:#e3e8e7; --muted:#98a4a7; --rule:#2d3639;
  --accent:#d27352; --ok:#63b384; --chip:#242c2e; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:22px 48px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:18px}
header{display:grid;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.kicker{font:700 12px/1 var(--type);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(26px,6vw,40px)/1.05 var(--display);margin:0;text-wrap:balance}
.how{margin:0;color:var(--muted);font-size:15px}
.decide{display:grid;gap:10px;background:var(--surface);border:1px solid var(--rule);padding:14px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border:1px solid var(--rule);background:var(--ground);cursor:pointer;font:600 17px/1.15 var(--display);letter-spacing:.01em;color:var(--ink);text-align:left;width:100%}
.opt .l{display:inline-grid;place-items:center;width:28px;height:28px;flex:none;border:1.5px solid var(--ink);font:700 15px/1 var(--type)}
.opt .rec{margin-left:auto;font:700 11px/1 var(--type);letter-spacing:.1em;text-transform:uppercase;color:var(--ok)}
.opt.picked{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.opt.picked .l{background:var(--accent);border-color:var(--accent);color:var(--ground)}
.opt:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:44px;font:15px/1.4 var(--body);color:var(--ink);background:var(--ground);border:1px solid var(--rule);padding:8px}
.saved,.tally{font:400 13px/1.4 var(--type);color:var(--muted)}
details{background:var(--surface);border:1px solid var(--rule)}
summary{cursor:pointer;padding:12px 14px;font:600 16px/1.25 var(--display);list-style-position:outside}
summary span{display:block;font:400 14px/1.4 var(--body);color:var(--muted);margin-top:2px}
.fold{display:grid;gap:12px;padding:0 14px 14px}
figure{margin:0;display:grid;gap:4px}
figure img{width:100%;height:auto;display:block;background:var(--chip)}
figcaption,.was{font:400 13px/1.45 var(--type);color:var(--muted);margin:0}
.was b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <header>
    <div class="kicker">LEDGER · The game's screens · Thursday 1 October</div>
    <h1>Which look for the game's screens?</h1>
    <p class="how">Three looks, each on the title, a conversation and the pause menu. Open one to see it; tap a picture for full size.</p>
  </header>
  <section class="decide" aria-labelledby="q">
    <div class="opts" id="opts" role="radiogroup" aria-label="The look"></div>
    <textarea id="note" placeholder="Anything to change in the one you pick (optional)"></textarea>
    <div class="tally" id="tally">Loading your pick…</div>
  </section>
  <div id="folds" class="wrap" style="gap:10px"></div>
  <details>
    <summary>About these pictures</summary>
    <div class="fold"><p class="was" id="about"></p></div>
  </details>
</div>
<script>
const PAGE = {
  key: "ui-direction",
  options: [
    {v:"A", name:"The fare book", line:"The cab office's own paperwork: a red account book, typed entries on ruled ledger paper.", rec:false,
     pics:["A-title","A-talk","A-pause"], notes:""},
    {v:"B", name:"The street's signs", line:"The street's own signs: a name plate for the title, green direction-sign panels, a white sign to type on.", rec:false,
     pics:["B-title","B-talk","B-pause"], notes:""},
    {v:"C", name:"The evening paper", line:"A 1990 local evening paper: blackletter masthead, headlines for choices, captions for speech.", rec:false,
     pics:["C-title","C-talk","C-pause"], notes:""},
  ],
  screens: {title:"Title screen", talk:"Talking to Sheila: her reply, and his next line being typed", pause:"Pause menu"},
  about: "",
};
const state = {};
let db = null, canWrite = true;
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) { if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v); }
  for (const k of kids) if (k) n.append(k);
  return n;
}
function save(patch){
  state.v = Object.assign({}, state.v || {}, patch, {at: new Date().toISOString()});
  render();
  if (!db || !canWrite) return;
  db.doc("verdicts/" + PAGE.key).set(Object.assign({}, state.v)).catch(e => { canWrite = false; render(); });
}
function render(){
  const st = state.v || {};
  const opts = document.getElementById("opts"); opts.replaceChildren();
  for (const o of PAGE.options) {
    const b = el("button", {type:"button", class:"opt" + (st.pick === o.v ? " picked" : ""), role:"radio", "aria-checked": st.pick === o.v ? "true" : "false", id:"opt-" + o.v},
      el("span", {class:"l", text:o.v}), el("span", {text:o.name}), o.rec ? el("span", {class:"rec", text:"Recommended"}) : null);
    b.addEventListener("click", () => save({pick:o.v}));
    opts.append(b);
  }
  const note = document.getElementById("note");
  if (document.activeElement !== note) note.value = st.note || "";
  document.getElementById("tally").textContent = st.pick
    ? "Picked " + st.pick + (st.at ? " · saved " + new Date(st.at).toLocaleString() : "") + (db ? "" : " · not stored on this view")
    : (db ? "Not picked yet" : "Not picked yet · picks are not stored on this view");
}
function folds(){
  const root = document.getElementById("folds");
  for (const o of PAGE.options) {
    const f = el("div", {class:"fold"});
    for (const p of o.pics) {
      const s = p.split("-")[1];
      f.append(el("figure", {}, el("img", {src:"pictures/" + p + ".jpg", alt:o.v + ", " + o.name + ": " + PAGE.screens[s], loading:"lazy", width:"3440", height:"1440"}),
        el("figcaption", {text:PAGE.screens[s]})));
    }
    if (o.notes) f.append(el("p", {class:"was", text:o.notes}));
    root.append(el("details", {id:"look-" + o.v}, el("summary", {}, document.createTextNode(o.v + " · " + o.name), el("span", {text:o.line})), f));
  }
  document.getElementById("about").textContent = PAGE.about;
}
document.getElementById("note").addEventListener("change", e => save({note:e.target.value}));
folds(); render();
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { render(); return; }
  try { const d = await db.doc("verdicts/" + PAGE.key).get(); if (d.exists) state.v = Object.assign({}, d.data()); } catch (e) {}
  render();
})();
</script>
