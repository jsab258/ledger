; MINIMUM CONFIG FOR A GAME TARGET TO START AT ALL.
;
; Run 6 built cleanly (cold 1.12 min, warm 0.03 min) and then the binary
; exited 3 in 6.19 seconds having written nothing. The project had no Config
; directory: UBT does not need one, the runtime does. This is the smallest
; set that lets engine init complete headless.
;
; Deliberately NOT tuned. Every setting added here is a setting that could
; change a build time this project exists to measure.

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=LedgerProbe

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/LedgerProbe")

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
; QUEUE 138 ITEM 1. Wired here rather than on the map's own WorldSettings
; because this project owns no editable copy of /Engine/Maps/Entry to put
; a WorldSettings override on: it is an engine asset, and the standing
; rule against a hand-edited scene applies to touching someone else's
; asset as much as it does to authoring a new one. ALedgerGameMode itself
; checks the command line and only builds the interactive street and
; swaps in ALedgerCharacter on a plain launch; -LedgerVignette,
; -LedgerShot and -LedgerGoldenTest all get ADefaultPawn and no second
; street, exactly as an unset game mode would have given them before this
; line existed. See LedgerGameMode.cpp.
GlobalDefaultGameMode=/Script/LedgerProbe.LedgerGameMode

[/Script/Engine.RendererSettings]
; LIGHT THAT BOUNCES AND REFLECTS, switched on 23 September for Jafar's
; presentable checklist ("the light is not flat and the street is wet as the
; sheet is"). Until today this file carried no renderer settings at all - it
; was written as the smallest config that lets a headless game start - so the
; street rendered with the engine's bare defaults: NO bounced light (the probe
; printed cvarDynamicGI=0) and screen-space reflections only
; (cvarReflectionMethod=2). Nothing had turned them off; nothing had turned
; them on. Lumen, in software, on this card (an RX 6700): the sky is shut out
; under eaves, cars and sills, light bounces off the brick and the road, and
; a wet surface reflects what is beside it rather than only what is on
; screen, which is where the flags' shine was set aside twice (FINDINGS 23
; Sep: "a reflection problem and not a roughness one"). Software Lumen traces
; the meshes' distance fields, so they are generated.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True

