name: LEDGER core tests

on:
  push:
    paths:
      # THE FILES EVERY SESSION READS, 3 October: tools/doc-caps.py fails a push that grows one past its cap.
      - "CLAUDE.md"
      - "RULINGS.md"
      - "NOW.md"
      - "TOWN.md"
      - "CLOTHES.md"
      - "ledger/**"
      - "tools/*.py"
      - "tools/*.sh"              # ci-checks.sh and reach-check.sh ARE the job now
      # THE CONTENT GATE AND THE APPROVALS read these (24 September): the gate
      # rotted for two weeks because a dialogue edit never started this job.
      - "content/**"
      - "game-design/**"
      - "canon.md"
      - "production/**"
      - "THIRD-PARTY.md"
      - "voice-candidates/**"     # a new asset drop must re-run the attribution gate
      # THE PORT'S OWN CHECKS run here too (port-golden, route-week, crime-probe
      # compile these), so a change to them alone starts the job (30 September:
      # a test that only g++ rejects reached main unseen).
      - "ue-probe/Source/LedgerProbe/Public/**"
      - "ue-probe/tests/**"
      - "ue-probe/perception-golden.txt"
      - ".github/workflows/ledger-core-tests.yml"
  workflow_dispatch:

# NOTHING EXPENSIVE HANGS OFF THIS FILE. Checked 25 Aug rather than assumed:
# no other workflow lists `.github/**` or this file in its paths, and the
# Windows build is `workflow_dispatch:` only, so editing this or the scripts
# it calls cannot start a 28-minute round trip or contend for the single
# Unity licence seat.

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # THE CHECKS ARE NOT STEPS ANY MORE, AND THAT IS THE FIX.
      #
      # Eight bare `run:` steps in a row is a fail-fast chain: a red step at
      # position 4 SKIPS every step below it. Four consecutive pushes
      # (b88adbb, cfd728a, 6137608, 80a9104) failed the reach check and
      # therefore never ran the docs check, either shape check, the
      # attribution check, the 2,884 CoreTests or the AI playtest — and the
      # job's single red could not tell "reach is out of bounds" from "the
      # test suite is broken" from "six checks never executed at all". Six
      # checks reporting NOTHING looked exactly like six checks reporting
      # fine. That is rule 3b — a zero needs a denominator — with a
      # workflow's skip logic supplying the zero.
      #
      # `continue-on-error` alone would have been the wrong repair: a step
      # that fails without failing the job is a gate loosened, and rule 2
      # forbids moving a bound to make red go away. So every check runs,
      # each outcome is recorded, and the script exits non-zero listing the
      # failures BY NAME with `passed=N/M` beside them. The job is still red
      # whenever any check is red; what changed is that you can see which.
      #
      # It lives in a script because a workflow's logic is untestable and a
      # script's is not — `tools/ci-checks.sh --selftest` runs the accepting
      # case, the rejecting case and the skip-the-rest case in about a
      # second, which is the step below.
      - name: Every cheap check, then the verdict naming which failed
        # THE VERDICT WHERE ANYONE CAN READ IT (5 October 2026): a job's log needs a signed-in
        # owner, but its annotations and step summary do not, so the verdict line and the last
        # lines of each failed check go there too.
        run: |
          # GitHub runs a step with -e: a bare failing pipeline ends the step before rc is read
          # (found 5 October: the first try wrote no annotation at all).
          set -o pipefail
          rc=0
          bash tools/ci-checks.sh 2>&1 | tee ci-checks.log || rc=$?
          verdict="$(tail -n 1 ci-checks.log)"
          echo "$verdict" >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -ne 0 ]; then
            echo "::error title=ci-checks::$verdict"
            for name in $(echo "$verdict" | sed -n 's/.*failed=//p' | tr ',' ' ' | sed 's/:rc[0-9]*//g'); do
              lines="$(grep -B 8 "check name=$name " ci-checks.log | tr '\n' ' ' | cut -c1-900)"
              echo "::error title=$name::$lines"
              grep -n -i -E "fail|error|refused" ci-checks.log | grep -i "$name" | tail -n 5 >> "$GITHUB_STEP_SUMMARY" || true
            done
          fi
          exit $rc

      # AND THE HARNESS THAT GRADED THEM, GRADED. `if: ${{ !cancelled() }}`
      # so a red check above cannot skip it — that is the exact fault this
      # commit exists to remove, and reintroducing it one step later would
      # be one idea with two implementations again. Not `continue-on-error`:
      # if the harness is broken the job must be red.
      - name: The harness itself, watched both ways
        if: ${{ !cancelled() }}
        run: bash tools/ci-checks.sh --selftest
