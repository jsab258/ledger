name: LEDGER AI playtest

# Exercises Lena's full brain without Unity, in fake mode (free,
# deterministic). THE LIVE MODE IS GONE (Jafar, 29 September): nothing in
# development calls the Anthropic API; model work runs through Claude Code on
# his subscription. It ran here on every Core push, 46 times on 28 and 29
# September.
on:
  workflow_dispatch:
  push:
    paths:
      - "ledger/Assets/Scripts/Core/**"
      - "ledger/Assets/Scripts/Game/LenaSetup.cs"
      - "ledger/SimHarness/**"
      - ".github/workflows/ledger-ai-playtest.yml"

jobs:
  ai-playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Playtest (fake mode)
        working-directory: ledger/SimHarness
        run: dotnet run -c Release

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-playtest-report
          path: ledger/SimHarness/sim-report.md
          retention-days: 14
