; LEDGER, 28 September 2026 (Jafar: "Cap Unreal's cache size in its own settings, so it trims itself").
; User-wide, so both projects and the build machine share one set of cache-server arguments.
; Research and sources: production/research/unreal-cache-cap (in the ledger repository).
[Zen.AutoLaunch]
; Drive C since 3 November (faster builds, try 1: his yes of 2 November 14:56 to about 17 GB more on C:, about 10 for this cache;
; production/research/faster-builds/FASTER-BUILDS-2026-11-02.md). On F: (30 September to 3 November) it could not grow: F: sits under
; his 20 GB floor. Unreal migrates to a changed default and deletes the old store (ZEN-PATH-2026-09-30.md), so F:'s copy goes by itself.
DataPath=C:/LedgerTools/zen/Data
; Epic's own arguments (BaseEngine.ini), with the age limit cut from 14 days to 7 and a size cap added (20 GiB on 28 September; 10 on his yes, 29 September; 6 on 2 October, when F: had 2.4 GB left and his new floor for F: is 20 GB; 10 on C: on 3 November, since the 2 November night build
; filled 6 to 6.98 GB mid-cook and threw 1.4 GB away while cooking, F:/LedgerTools/tmp/zen-night/zen-used-2026-11-03.txt).
ExtraArgs=--http asio --gc-cache-duration-seconds 604800 --gc-interval-seconds 21600 --gc-low-diskspace-threshold 2147483648 --gc-disksize-softlimit 10737418240 --cache-bucket-limit-overwrites --quiet --restrict-content-types --allow-external-oidctoken-exe=false

[DerivedDataCacheStores]
; The old file cache duplicates the Zen store: read and write nothing new, and let its cleaner drain files unused for 7 days.
InstalledLocal=(Type=FileSystem, DeleteOnly=true, UnusedFileAge=7, Path="%ENGINEVERSIONAGNOSTICUSERDIR%DerivedDataCache")
